# Google App Engine configuration
# Deploy with: gcloud app deploy

runtime: nodejs18
env: standard
instance_class: F2

# Automatic scaling configuration
automatic_scaling:
  min_instances: 1
  max_instances: 10
  target_cpu_utilization: 0.65
  target_throughput_utilization: 0.6

# Environment variables
env_variables:
  NODE_ENV: "production"

# VPC Access Connector for Cloud SQL and Redis
vpc_access_connector:
  name: "projects/PROJECT_ID/locations/REGION/connectors/yana-ogo-connector"

# Handlers
handlers:
- url: /.*
  script: auto
  secure: always
  redirect_http_response_code: 301

# Health check
liveness_check:
  path: "/health"
  check_interval_sec: 30
  timeout_sec: 4
  failure_threshold: 2
  success_threshold: 2

readiness_check:
  path: "/health"
  check_interval_sec: 5
  timeout_sec: 4
  failure_threshold: 2
  success_threshold: 2
  app_start_timeout_sec: 300
