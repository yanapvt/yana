services:
  postgres:
    image: postgres:16-alpine
    container_name: yana-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: yana_ogo
      POSTGRES_USER: yana
      POSTGRES_PASSWORD: yana_password
    ports:
      - '5432:5432'
    volumes:
      - yana-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U yana -d yana_ogo']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: yana-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - yana-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  yana-postgres-data:
  yana-redis-data:
